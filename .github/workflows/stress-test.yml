name: Stress Test com Locust

on:
  workflow_dispatch:
  push:
    branches: [main]

jobs:
  locust:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: apardo04/locust-github-action@1.1.0
        with:
          LOCUSTFILE: locustfile.py
          URL: https://automationexercise.com
          USERS: 10
          RATE: 2
          RUNTIME: 30s
