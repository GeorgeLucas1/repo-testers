name: Stress Test com Locust # REGRA 5: comentário — nome do workflow

on: # REGRA 1: chave: valor
  push:
    branches:
      - main # dispara quando você faz push na branch main

jobs:
  stress-test: # nome do job
    runs-on: ubuntu-latest # máquina virtual Linux gratuita do GitHub

    steps:

      # ── STEP 1: baixa o seu código na máquina virtual ──────────────
      - name: Locust
        uses: actions/checkout@v4

      # ── STEP 2: instala o Python ────────────────────────────────────
      - name: Configurar Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      # ── STEP 3: instala o Locust ────────────────────────────────────
      - name: Instalar dependências
        run: pip install locust

      # ── STEP 4: roda o teste (modo headless = sem interface gráfica) ─
      - name: Rodar stress test
        run: |
          locust \
            --headless \
            --users 50 \
            --spawn-rate 5 \
            --run-time 60s \
            --host https://automationexercise.com \
            --csv relatorio \
            --html relatorio.html

      # ── STEP 5: salva os relatórios para download no GitHub ─────────
      - name: Salvar relatório como artefato
        uses: actions/upload-artifact@v4
        if: always() # salva mesmo se o teste falhar
        with:
          name: relatorio-locust
          path: |
            relatorio.html
            relatorio_stats.csv
            relatorio_failures.csv